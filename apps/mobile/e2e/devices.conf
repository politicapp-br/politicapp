# Matriz de dispositivos de teste do Politicapp (lida por e2e/devices.sh).
#
# Cada perfil vira UM dispositivo "golden" (AVD no Android, simulador no iOS)
# criado uma única vez. As instâncias que o `up` sobe são cópias efêmeras
# dele: Android em modo -read-only (zero disco extra), iOS via clone APFS.
#
# Adicionar um perfil = adicionar uma linha. Imagens Android que não estiverem
# instaladas são baixadas pelo `setup` (cada API nova custa ~1,5–3 GB).

# Android: perfil|system image|hardware profile (avdmanager list device -c)|RAM MB
#   aosp_atd = imagem "Automated Test Device": sem apps de sistema, mais leve.
#   Não tem navegador: fluxos que abrem link externo (SourceLink) precisam do a36-full.
ANDROID_PROFILES="
a36|system-images;android-36;aosp_atd;arm64-v8a|pixel_8|2048
a36-small|system-images;android-36;aosp_atd;arm64-v8a|small_phone|2048
a36-tablet|system-images;android-36;aosp_atd;arm64-v8a|pixel_tablet|2560
a30|system-images;android-30;aosp_atd;arm64-v8a|pixel_5|2048
a24|system-images;android-24;default;arm64-v8a|pixel_4|1536
a36-full|system-images;android-36;google_apis;arm64-v8a|pixel_9|2560
"
ANDROID_DEFAULT_PROFILE="a36"

# iOS: perfil|device type|runtime (xcrun simctl list devicetypes / runtimes)
#   Runtimes >= 18.5 ficam "slim" permanentemente; 18.3 é re-slimado a cada boot.
IOS_PROFILES="
iphone|iPhone 17 Pro|iOS-26-2
iphone-se|iPhone SE (3rd generation)|iOS-26-2
iphone-max|iPhone 17 Pro Max|iOS-26-2
ipad|iPad (A16)|iOS-26-2
iphone-ios18|iPhone 16e|iOS-18-3
"
IOS_DEFAULT_PROFILE="iphone"

# Categorias do simslim que continuam LIGADAS (simslim profiles).
#   web: universal links / serviços web — o app abre fontes oficiais via expo-web-browser.
SIMSLIM_EXCEPT="web"

# GPU do emulador headless. swiftshader_indirect é o mais estável com várias
# instâncias; "host" é mais rápido mas pode falhar sem janela.
ANDROID_GPU="swiftshader_indirect"
ANDROID_CORES=2

# Perfis Android que ganham snapshot de RAM (boot ~4s em vez de ~16s).
# Custo: ~hw.ramSize em disco por perfil (2 GB+). Os demais fazem cold boot.
ANDROID_SNAPSHOTS="a36"
